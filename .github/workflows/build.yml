name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish the self-contained app
        run: dotnet publish Ets2Cluster.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: Ets2Cluster-win-x64
          path: publish
